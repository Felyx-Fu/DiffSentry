name: AgentGuard
description: Deterministic verification for Node.js changes
inputs:
  base:
    description: Git ref or commit SHA to use as the comparison base.
    required: false
    default: ""
  head:
    description: Git ref or commit SHA to use as the comparison head.
    required: false
    default: ""
  config:
    description: Path to the JSON AgentGuard configuration file.
    required: false
    default: ""
  format:
    description: Report format: terminal, json, or markdown.
    required: false
    default: json
  fail-on:
    description: Verdict threshold that fails the action: fail, review, or never.
    required: false
    default: fail
outputs:
  risk-score:
    description: The deterministic AgentGuard risk score from 0 to 100.
  verdict:
    description: The AgentGuard verdict: pass, review, or fail.
runs:
  using: node24
  main: dist/main.js
