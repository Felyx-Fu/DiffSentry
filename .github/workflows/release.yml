name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE to build and publish the reviewed release from main.
        required: true
        default: ""
        type: string

# Release is opt-in and the job grants write access only after the explicit
# confirmation and main-branch checks below pass.
permissions:
  contents: read

concurrency:
  group: agentguard-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirm == 'RELEASE' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages and Action bundle
        run: pnpm build

      - name: Verify pending release plan
        run: pnpm changeset status

      - name: Upload GitHub Action bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-github-action-bundle-${{ github.sha }}
          path: apps/github-action/dist
          if-no-files-found: error

      - name: Version or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
