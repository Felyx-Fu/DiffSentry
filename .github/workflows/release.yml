name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE to build and publish the reviewed release from main.
        required: true
        default: ""
        type: string

# Release is opt-in and the job grants write access only after the explicit
# confirmation and main-branch checks below pass.
permissions:
  contents: read

concurrency:
  group: diffsentry-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirm == 'RELEASE' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify npm Trusted Publishing CLI
        run: |
          npm --version
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const minimum = [11, 5, 1];
          const version = execFileSync("npm", ["--version"], {
            encoding: "utf8",
          }).trim();
          const actual = version.split(".").map(Number);
          const meetsMinimum =
            actual.length === minimum.length &&
            actual.every(Number.isInteger) &&
            (actual[0] > minimum[0] ||
              (actual[0] === minimum[0] &&
                (actual[1] > minimum[1] ||
                  (actual[1] === minimum[1] && actual[2] >= minimum[2]))));

          if (!meetsMinimum) {
            throw new Error(
              `npm ${version} is below the Trusted Publishing minimum of 11.5.1`,
            );
          }

          console.log(
            `npm ${version} satisfies the Trusted Publishing minimum of 11.5.1`,
          );
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages and Action bundle
        run: pnpm build

      - name: Verify pending release plan
        run: pnpm changeset status

      - name: Upload GitHub Action bundle
        uses: actions/upload-artifact@v4
        with:
          name: diffsentry-github-action-bundle-${{ github.sha }}
          path: apps/github-action/dist
          if-no-files-found: error

      - name: Version or publish packages
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          create-github-releases: false
          push-git-tags: false
